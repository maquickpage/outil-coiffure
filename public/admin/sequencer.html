<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --ink:#1a1d21; --muted:#6b7280;
          --accent:#2563eb; --green:#16a34a; --red:#dc2626; --amber:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .seq-head { display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 18px; background:var(--card); border-bottom:1px solid var(--line); }
  .seq-head h1 { font-size:16px; margin:0; }
  .pill { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); }
  .pill.running { color:#fff; background:var(--green); border-color:var(--green); }
  .pill.paused  { color:#fff; background:var(--amber); border-color:var(--amber); }
  .pill.mixed   { color:#fff; background:var(--muted); border-color:var(--muted); }
  .pill.err     { color:#fff; background:var(--red); border-color:var(--red); }
  .grow { flex:1; }
  .seq-tabs { display:flex; gap:4px; padding:0 12px; background:var(--card); border-bottom:1px solid var(--line); overflow-x:auto; }
  .seq-tabs button { border:0; background:none; padding:11px 14px; font-size:14px; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  .seq-tabs button.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
  main { padding:16px; max-width:1150px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  button.btn { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  button.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.btn.danger  { color:var(--red); border-color:#f3c6c6; }
  button.btn.small   { padding:4px 10px; font-size:12px; }
  button.btn:disabled { opacity:.5; cursor:default; }
  .stats { display:grid; grid-template-columns:repeat(auto-fill,minmax(115px,1fr)); gap:10px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:22px; }
  .stat span { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; }
  .scroll { overflow-x:auto; }
  .badge { font-size:11px; padding:2px 7px; border-radius:999px; border:1px solid var(--line); white-space:nowrap; }
  /* Chips : UN mécanisme pour tout — chaque nombre est un filtre. */
  .chips { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px;
          padding:5px 11px; font-size:13px; background:var(--card); cursor:pointer; line-height:1; color:var(--ink); }
  .chip b { font-size:15px; font-weight:600; }
  .chip:hover { border-color:var(--ink); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip.dim { opacity:.55; }
  .chip.static { cursor:default; }
  .chip.static:hover { border-color:var(--line); }
  .chip.warn { border-color:var(--amber); color:var(--amber); }
  .chip.err  { border-color:var(--red);   color:var(--red); }
  .chip-lbl { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-right:2px; }
  .arrow { color:var(--muted); padding:0 2px; }
  .dots { letter-spacing:2px; font-size:11px; color:var(--muted); }
  .dots i { font-style:normal; color:var(--ink); }
  .act { font-size:12px; white-space:nowrap; }
  .act span { cursor:help; margin-right:5px; }
  .sub { display:block; font-size:11px; color:var(--muted); }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--ink); }
  th .dir { font-size:10px; margin-left:3px; }
  .b-activite_humaine { color:var(--green); border-color:#bfe3c9; }
  .b-ouverture_non_confirmee { color:var(--amber); border-color:#f3dcb3; }
  .b-pas_de_trace { color:var(--muted); }
  .b-slug_incoherent { color:var(--red); border-color:#f3c6c6; }
  .b-active{color:var(--accent);border-color:#c7d7fb}.b-queued{color:var(--muted)}.b-replied{color:var(--green);border-color:#bfe6c9}
  .b-stopped,.b-failed,.b-unsubscribed{color:var(--red);border-color:#f3c6c6}.b-completed{color:#111;background:#eef1f4}
  .b-ok{color:var(--green);border-color:#bfe6c9}.b-down{color:var(--red);border-color:#f3c6c6}.b-pending{color:var(--amber);border-color:#f5deb8}
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 3px; }
  input, textarea, select { width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:7px; font:inherit; background:#fff; }
  textarea { min-height:90px; resize:vertical; font-family:ui-monospace,Menlo,monospace; font-size:13px; }
  .step-card { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .muted { color:var(--muted); font-size:12px; }
  .setup-banner { border:1px solid #f5deb8; background:#fdf6e7; border-radius:10px; padding:12px 16px; margin-bottom:16px; font-size:13px; }
  .setup-banner b { color:var(--amber); }
  .setup-banner ul { margin:6px 0 0; padding-left:20px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#111; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; max-width:90%; white-space:pre-wrap; display:none; z-index:130; }
  #toast.err { background:var(--red); }
  .hide { display:none; }
  @media (max-width:640px){ .grid2{grid-template-columns:1fr;} }
</style>

<div class="seq-head">
  <h1 id="t-title">Séquenceur cold-email</h1>
  <span id="campPill" class="pill">…</span>
  <span class="grow"></span>
  <span class="muted" id="clock"></span>
  <span class="muted" id="dataAge" title="Les données des nœuds sont mises en cache côté portail : changer d'onglet ne les recharge pas."></span>
  <button class="btn" id="refreshBtn" onclick="reloadManual()">↻ <span id="t-refresh">Actualiser</span></button>
</div>
<nav class="seq-tabs">
  <button class="active" data-tab="overview" onclick="tab(this)" id="t-tab-overview">Vue d'ensemble</button>
  <button data-tab="leads" onclick="tab(this)" id="t-tab-leads">Leads</button>
  <button data-tab="import" onclick="tab(this)" id="t-tab-import">Import CSV</button>
  <button data-tab="template" onclick="tab(this)" id="t-tab-template">Séquence</button>
  <button data-tab="mailboxes" onclick="tab(this)" id="t-tab-mailboxes">Boîtes</button>
  <button data-tab="nodes" onclick="tab(this)" id="t-tab-nodes">Nœuds</button>
</nav>

<main>
  <div id="setupBanner" class="setup-banner hide"></div>

  <!-- VUE D'ENSEMBLE -->
  <section id="overview">
    <div class="card">
      <div class="row" style="margin-bottom:14px">
        <button class="btn primary" id="startBtn" onclick="setCampaign('running')"></button>
        <button class="btn" id="pauseBtn" onclick="setCampaign('paused')"></button>
        <span class="muted" id="t-dispatcher-hint"></span>
      </div>
      <div class="chips" id="funnelBar" style="margin-bottom:8px"></div>
      <div class="chips" id="outcomeBar" style="margin-bottom:8px"></div>
      <div class="chips" id="statusBar"></div>
      <p class="muted" id="engNote" style="margin:8px 0 0;font-size:12px"></p>
      <p class="muted" id="capacity" style="margin:6px 0 0"></p>
    </div>
    <div class="card">
      <h3 style="margin-top:0" id="t-mb-today"></h3>
      <div class="scroll"><table id="mbMini"><thead><tr>
        <th id="th-mb"></th><th id="th-nodestate"></th><th id="th-campaign"></th><th id="th-sentcap"></th><th id="th-window"></th><th id="th-days"></th><th></th>
      </tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <!-- LEADS -->
  <section id="leads" class="hide">
    <div class="card scroll">
      <div class="chips" id="leadChips" style="margin-bottom:8px"></div>
      <div class="row" style="margin-bottom:10px;gap:8px">
        <select id="leadBox" style="width:auto" onchange="setFilter('box', this.value)"></select>
        <input id="leadSearch" type="search" style="width:240px" oninput="setFilter('q', this.value)">
        <span class="muted" id="leadCount"></span>
      </div>
      <table id="leadTbl"><thead><tr>
        <th>#</th>
        <th id="th-salon"></th>
        <th id="th-leadmb"></th>
        <th id="th-step" class="sortable" onclick="setSort('step')"></th>
        <th id="th-envoye" class="sortable" onclick="setSort('sent')"></th>
        <th id="th-activite" class="sortable" onclick="setSort('act')"></th>
        <th id="th-issue"></th>
        <th></th>
      </tr></thead><tbody></tbody></table>
      <p class="muted" id="leadEmpty"></p>
    </div>
    <div class="card">
      <h3 style="margin-top:0" id="t-supp-title"></h3>
      <p class="muted" id="t-supp-help"></p>
      <textarea id="suppText" placeholder="email1@exemple.fr&#10;email2@exemple.fr" style="min-height:60px"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn danger" onclick="pushSuppression()" id="t-supp-btn"></button></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0" id="t-unsub-title"></h3>
      <p class="muted" id="t-unsub-help"></p>
      <p id="unsubCounts" class="muted"></p>
      <p id="unsubVerdicts" class="muted"></p>
      <p id="unsubVerdictHelp" class="muted" style="font-size:12px"></p>
      <div class="scroll"><table id="unsubTbl"><thead><tr>
        <th id="th-unsub-email"></th><th id="th-unsub-source"></th><th id="th-unsub-date"></th>
        <th id="th-unsub-activite"></th><th id="th-unsub-etat"></th>
      </tr></thead><tbody></tbody></table></div>
      <p class="muted" id="unsubEmpty"></p>
      <p class="muted" id="unsubRecon"></p>
    </div>
  </section>

  <!-- IMPORT -->
  <section id="import" class="hide">
    <div class="card">
      <h3 style="margin-top:0" id="t-import-title"></h3>
      <p class="muted" id="t-import-help"></p>
      <label id="t-import-dest"></label>
      <select id="importTarget"></select>
      <label id="t-import-file"></label>
      <input type="file" id="csvFile" accept=".csv,text/csv">
      <textarea id="csvText" style="margin-top:10px"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" id="importBtn" onclick="doImport()"></button>
      </div>
      <div id="importResult" class="muted" style="margin-top:10px; white-space:pre-wrap"></div>
    </div>
  </section>

  <!-- SÉQUENCE -->
  <section id="template" class="hide">
    <div class="card">
      <h3 style="margin-top:0" id="t-steps-title"></h3>
      <p class="muted"><span id="t-steps-help"></span> <span id="stepsSource"></span></p>
      <div id="stepsDiffWarn" class="setup-banner hide"></div>
      <div id="steps"></div>
      <button class="btn primary" id="saveStepsBtn" onclick="saveSteps()"></button>
      <span id="unsavedFlag" class="muted hide" style="margin-left:10px;color:#b45309"></span>
    </div>
  </section>

  <!-- BOÎTES -->
  <section id="mailboxes" class="hide">
    <div id="mbEditors"></div>
  </section>

  <!-- NŒUDS -->
  <section id="nodes" class="hide">
    <div class="card">
      <h3 style="margin-top:0" id="t-nodes-title"></h3>
      <p class="muted" id="t-nodes-help"></p>
      <div class="scroll"><table id="nodeTbl"><thead><tr>
        <th id="th-node-mb"></th><th id="th-node-label"></th><th>URL /exec</th><th>Token</th><th id="th-node-enabled"></th><th id="th-node-health"></th><th></th>
      </tr></thead><tbody></tbody></table></div>
    </div>
    <div class="card">
      <h3 style="margin-top:0" id="nodeFormTitle"></h3>
      <input type="hidden" id="nf-id">
      <div class="grid2">
        <div><label id="t-nf-mailbox"></label><input id="nf-mailbox" placeholder="solene@getquickpage.fr"></div>
        <div><label id="t-nf-label"></label><input id="nf-label" placeholder="Solene Perrin"></div>
      </div>
      <label id="t-nf-url"></label>
      <input id="nf-url" placeholder="https://script.google.com/macros/s/…/exec">
      <label id="t-nf-token"></label>
      <input id="nf-token" placeholder="initApiToken()">
      <label><input type="checkbox" id="nf-enabled" checked style="width:auto"> <span id="t-nf-enabled"></span></label>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" onclick="saveNode()" id="t-nf-save"></button>
        <button class="btn" onclick="resetNodeForm()" id="t-nf-cancel"></button>
      </div>
    </div>
  </section>
</main>

<div id="toast"></div>

function tab(btn){
  document.querySelectorAll('.seq-tabs button').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  ['overview','leads','import','template','mailboxes','nodes'].forEach(function(id){

  });
}
function toast(msg, isErr){
  var t2 = document.getElementById('toast'); t2.textContent = msg; t2.className = isErr ? 'err' : '';
  t2.style.display = 'block'; clearTimeout(t2._h); t2._h = setTimeout(function(){ t2.style.display='none'; }, isErr ? 8000 : 3000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function setBusy(b){ BUSY=b; document.querySelectorAll('button.btn').forEach(function(x){ x.disabled=b; }); }

// Garde-fou : sans plafond, un /overview qui pend laisse BUSY à true et TOUS les
// boutons grisés jusqu'au rechargement de la page.
var API_TIMEOUT_MS = 150000;
function api(path, opts){
  opts = opts || {};
  opts.credentials = 'same-origin';
  if (window.AbortController) {
    var ac = new AbortController();
    opts.signal = ac.signal;
    setTimeout(function(){ ac.abort(); }, API_TIMEOUT_MS);
  }
  if (opts.body) { opts.method = opts.method || 'POST'; opts.headers = { 'Content-Type': 'application/json' }; opts.body = JSON.stringify(opts.body); }
  return fetch('/admin/api/sequencer' + path, opts).then(function(r){
    if (r.status === 401) { location.href = '/admin/login'; throw new Error('401'); }
    return r.json();
  });
}

// Modifications non enregistrées. /overview interroge les nœuds Apps Script et peut
// mettre plus d'une minute à répondre : tester « est-ce que l'utilisateur tape ? » au
// LANCEMENT de la requête ne protège rien, la réponse revient bien après. Le verrou est
// donc posé au MOMENT DU RENDU (renderSteps / renderMailboxes), quelle que soit l'origine
// du rafraîchissement — timer, réponse tardive, enregistrement d'une autre section.
var DIRTY_STEPS = false, DIRTY_MB = false;
function anyDirty(){ return DIRTY_STEPS || DIRTY_MB; }
function onEdit(e){
  var el = e.target; if (!el || !el.closest) return;
  if (el.closest('#steps')) DIRTY_STEPS = true;
  else if (el.closest('#mbEditors')) DIRTY_MB = true;
  else return;
  showUnsaved();
}
document.addEventListener('input', onEdit);
document.addEventListener('change', onEdit);
window.addEventListener('beforeunload', function(e){
  if (anyDirty()) { e.preventDefault(); e.returnValue = ''; }
});
function showUnsaved(){
  var el = document.getElementById('unsavedFlag');
  if (el) el.classList.toggle('hide', !DIRTY_STEPS);
}

// Le bouton ↻ est le seul moyen d'écraser volontairement une saisie en cours.
function reloadManual(){
  if (anyDirty() && !confirm(t('refresh_confirm'))) return;
  DIRTY_STEPS = false; DIRTY_MB = false; showUnsaved();
  load(false, { refresh: 1 });
}

// Relance des seuls nœuds tombés, sans réinterroger ceux qui répondent.
function retryDownNodes(){
  load(false, { retry_failed: 1 });
}

// silent = rafraîchissement de fond : ne grise pas les boutons, ne toaste pas.
// Les réponses des nœuds sont mises en cache côté portail : par défaut on les
// réutilise (naviguer entre onglets ne doit pas repayer un aller-retour Apps
// Script), `opts` permet de forcer une relance.
function load(silent, opts){
  if (!silent) setBusy(true);
  var qs = Object.keys(opts || {}).map(function(k){ return k + '=' + opts[k]; }).join('&');
  loadUnsubscribes();
  return api('/overview' + (qs ? '?' + qs : '')).then(function(d){
    DATA = d;
    // finally : si render() casse, BUSY doit quand même retomber, sinon
    // tous les boutons restent grisés définitivement.
    try { render(); }
    finally { if (!silent) setBusy(false); }
  }).catch(function(e){
    if (silent) return;
    toast(t('load_fail') + e.message, true); setBusy(false);
  });
}

function okNodes(){ return (DATA && DATA.nodes || []).filter(function(n){ return n.ok; }); }

function render(){

  renderBanner();

  renderImportTargets();
  renderSteps();
  renderMailboxes();
  renderNodes();
}

// --- bannière setup en attente ---
function renderBanner(){
  var reg = DATA.nodes_registered || [];
  var byMb = {}; reg.forEach(function(n){ byMb[n.mailbox] = n; });
  var missing = EXPECTED_MAILBOXES.filter(function(m){ return !byMb[m]; });
  var down = (DATA.nodes || []).filter(function(n){ return !n.ok; });
  renderDataAge();
  var el = document.getElementById('setupBanner');
  if (!missing.length && !down.length) { el.classList.add('hide'); return; }
  var html = '<b>' + t('setup_pending') + '</b><ul>';
  missing.forEach(function(m){ html += '<li>' + t('setup_missing', { mb: '<b>' + esc(m) + '</b>' }) + '</li>'; });
  down.forEach(function(n){
    html += '<li>' + t('setup_down', { mb: '<b>' + esc(n.mailbox) + '</b>' }) + esc(n.error || '')
      + (n.fetched_at ? ' <span class="muted">(' + esc(n.fetched_at.slice(11, 19)) + ' UTC)</span>' : '') + '</li>';
  });
  html += '</ul>';
  // Relancer les seuls nœuds tombés : les nœuds sains gardent leurs données en cache.
  if (down.length) html += '<button class="btn small" onclick="retryDownNodes()">' + t('retry_down') + '</button>';
  el.innerHTML = html; el.classList.remove('hide');
}

// Âge des données affichées : le portail sert le cache des nœuds tant qu'aucune
// écriture ne l'invalide, il faut donc dire clairement de quand elles datent.
function renderDataAge(){
  var el = document.getElementById('dataAge');
  if (!el) return;
  var stamps = (DATA.nodes || []).map(function(n){ return n.fetched_at; }).filter(Boolean).sort();
  if (!stamps.length) { el.textContent = ''; return; }
  var vieux = new Date(stamps[0]);
  var ageS = Math.round((Date.now() - vieux.getTime()) / 1000);
  el.textContent = ageS < 20 ? t('data_live')
    : t('data_age', { h: vieux.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) });
}

  else if (statuses.every(function(s){ return s === 'paused'; }))  { pill.textContent = 'paused'; pill.className = 'pill paused'; }

    capEl.textContent = txt;

    if (!n.ok) {
      rows.push('<tr><td>'+esc(n.mailbox)+'</td><td><span class="badge b-down">'+t('badge_down')+'</span></td>'
        +'<td colspan="4" class="muted">'+esc(n.error||'')+'</td>'
        +'<td></td></tr>');

    }
    (n.mailboxes || []).forEach(function(m){
      var over = m.sent_today >= m.daily_cap;
      rows.push('<tr><td>'+esc(m.address)+'</td>'
        +'<td><span class="badge b-ok">'+t('badge_ok')+'</span></td>'
        +'<td><span class="pill '+esc(n.campaign_status)+'">'+esc(n.campaign_status)+'</span></td>'
        +'<td'+(over?' style="color:var(--amber)"':'')+'>'+m.sent_today+' / '+m.daily_cap+'</td>'
        +'<td>'+esc(m.window_start)+'–'+esc(m.window_end)+'</td>'
        +'<td>'+esc(m.send_days)+'</td>'
        +'<td>'+(n.campaign_status==='running'
            ? '<button class="btn small" onclick="setCampaignNode('+n.node_id+',\'paused\')">'+t('btn_pause')+'</button>'
            : '<button class="btn small" onclick="setCampaignNode('+n.node_id+',\'running\')">'+t('btn_start')+'</button>')+'</td></tr>');
    });
  });

function countEtat(k){ var n = 0; okNodes().forEach(function(nd){ (nd.leads||[]).forEach(function(l){ if (l.etat === k) n++; }); }); return n; }
function goLeads(kind, val){
  // un clic sur un chip déjà actif l'éteint ; un chip d'une autre famille remplace le sien
  FILTER[kind] = (FILTER[kind] === val) ? '' : val;
  var btn = document.querySelector('.seq-tabs button[data-tab="leads"]');
  if (btn && !btn.classList.contains('active')) tab(btn);
  syncHash(); SORT_DIRTY = true; renderChips(); renderLeads();
}
function clearChips(){ FILTER.status = FILTER.eng = FILTER.issue = ''; syncHash(); SORT_DIRTY = true; renderChips(); renderLeads(); }
function setFilter(k, v){ FILTER[k] = v || ''; syncHash(); renderLeads(); }
function setSort(key){
  if (SORT.key === key) SORT.dir = SORT.dir === 'desc' ? 'asc' : 'desc'; else { SORT.key = key; SORT.dir = 'desc'; }
  SORT_DIRTY = true; renderLeads();
}
function syncHash(){
  var q = []; ['status','eng','issue','box'].forEach(function(k){ if (FILTER[k]) q.push(k+'='+encodeURIComponent(FILTER[k])); });
  try { history.replaceState(null, '', location.pathname + (q.length ? '#leads?'+q.join('&') : '')); } catch(e){}
}
function readHash(){
  var m = /^#leads\?(.*)$/.exec(location.hash || ''); if (!m) return;
  m[1].split('&').forEach(function(kv){ var p = kv.split('='); if (p[0] in FILTER) FILTER[p[0]] = decodeURIComponent(p[1]||''); });
  var btn = document.querySelector('.seq-tabs button[data-tab="leads"]'); if (btn) tab(btn);
}

// temps relatif, par langue (clés rel_*), toujours calculé sur l'heure de Paris fournie par le nœud
function parisMs(str){ // "YYYY-MM-DD HH:MM" Paris → epoch, via l'offset courant du navigateur pour Paris
  if (!str) return null;
  var m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2})/.exec(str); if (!m) return null;
  var guess = Date.UTC(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
  var off = parisOffsetMin(guess); var e = guess - off*60000; var off2 = parisOffsetMin(e); if (off2 !== off) e = guess - off2*60000;
  return e;
}
var _pf = null;
function parisOffsetMin(ms){
  _pf = _pf || new Intl.DateTimeFormat('en-US', { timeZone:'Europe/Paris', hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
  var g = {}; _pf.formatToParts(new Date(ms)).forEach(function(p){ g[p.type] = p.value; });
  return Math.round((Date.UTC(+g.year, +g.month-1, +g.day, +g.hour, +g.minute) - ms)/60000);
}
function rel(str){
  var ms = parisMs(str); if (ms == null) return t('rel_never');
  var d = Math.max(0, Date.now() - ms), mn = Math.floor(d/60000);
  if (mn < 1) return t('rel_now'); if (mn < 60) return t('rel_min', {n: mn});
  var h = Math.floor(mn/60); if (h < 48) return t('rel_h', {n: h});
  return t('rel_d', {n: Math.floor(h/24)});
}
function dots(step){ var o = ''; for (var i = 1; i <= 5; i++) o += (i <= step ? '<i>●</i>' : '○'); return '<span class="dots" title="'+step+'/5">'+o+'</span>'; }
function actCell(l){
  var a = l.activite; if (!a) return '<span class="muted">'+t('act_none')+'</span>';
  var h = '<span class="act">';
  h += '<span title="'+esc(t('act_open'))+'">👁 '+a.ouvertures+'</span>';
  if (a.prix_vu)  h += '<span title="'+esc(t('act_prix'))+'">€</span>';
  if (a.scrolls)  h += '<span title="'+esc(t('act_scroll'))+'">↧</span>';
  if (a.editions) h += '<span title="'+esc(t('act_edit'))+'">✎</span>';
  h += '<span title="'+esc(a.appareil === 'mobile' ? t('act_mobile') : t('act_desktop'))+'">'+(a.appareil === 'mobile' ? '📱' : '💻')+'</span>';
  h += '<span class="muted" title="'+esc(t('act_first_delay', {m: a.delai_premier_min}))+'">'+esc(rel(a.dernier))+'</span>';
  h += '</span>';
  return h;
}
function passes(l){
  if (FILTER.status && l.status !== FILTER.status) return false;
  if (FILTER.box && l.mailbox !== FILTER.box) return false;
  if (FILTER.issue && l.issue !== FILTER.issue) return false;
  var a = l.activite;
  switch (FILTER.eng) {
    case '': break;
    case 'contacted': if (!(Number(l.current_step) >= 1)) return false; break;
    case 'ouvert': if (!(a && a.ouvertures > 0)) return false; break;
    case 'prix_vu': if (!(a && a.prix_vu > 0)) return false; break;
    case 'humaine': if (l.etat !== 'activite_humaine') return false; break;
    case 'non_confirmee': if (l.etat !== 'ouverture_non_confirmee') return false; break;
    case 'pas_de_trace': if (l.etat !== 'pas_de_trace') return false; break;
    case 'inconnu': if (!(Number(l.current_step) >= 1 && !l.first_sent_at)) return false; break;
    case 'slug_incoherent': if (l.etat !== 'slug_incoherent') return false; break;
  }
  if (FILTER.q) {
    var q = FILTER.q.toLowerCase();
    if (String(l.salon_name||'').toLowerCase().indexOf(q) === -1 && String(l.email||'').toLowerCase().indexOf(q) === -1) return false;
  }
  return true;
}
function sortVal(l){
  if (SORT.key === 'step') return Number(l.current_step)||0;
  if (SORT.key === 'sent') return parisMs(l.first_sent_at) || 0;
  return l.activite ? (parisMs(l.activite.dernier)||0) : 0; // 'act'
}
function renderLeads(){
  var nodes = okNodes(), nb = nodes.length || 1;
  // Ordre d'ENVOI (rang round-robin), partagé avec la page Photos : le # ne bouge jamais.
  var all = [];
  nodes.forEach(function(n, ni){ (n.leads || []).forEach(function(l, i){ all.push({ l: l, n: n, rank: i * nb + ni }); }); });
  all.sort(function(a, b){ return a.rank - b.rank; });
  all.forEach(function(it, i){ it.rang = i + 1; });
  // boîtes (select) — reconstruit sans perdre la sélection
  var boxSel = document.getElementById('leadBox');
  if (boxSel && boxSel.options.length !== nodes.length + 1) {
    boxSel.innerHTML = '<option value="">'+esc(t('box_all'))+'</option>' + nodes.map(function(n){ return '<option value="'+esc(n.mailbox)+'">'+esc(n.mailbox.split('@')[0])+'</option>'; }).join('');
    boxSel.value = FILTER.box;
  }
  var srch = document.getElementById('leadSearch'); if (srch && srch.placeholder !== t('search_ph')) srch.placeholder = t('search_ph');
  // tri : appliqué sur action utilisateur ou premier rendu ; le poll garde l'ordre courant
  var byEmail = {}; all.forEach(function(it){ byEmail[String(it.l.email||'').toLowerCase()] = it; });
  if (SORT_DIRTY || !LEAD_ORDER) {
    var sorted = all.slice().sort(function(x, y){ var d = sortVal(y.l) - sortVal(x.l); if (SORT.dir === 'asc') d = -d; return d || (x.rank - y.rank); });
    LEAD_ORDER = sorted.map(function(it){ return String(it.l.email||'').toLowerCase(); }); SORT_DIRTY = false;
  } else {
    all.forEach(function(it){ var k = String(it.l.email||'').toLowerCase(); if (LEAD_ORDER.indexOf(k) === -1) LEAD_ORDER.push(k); });
  }
  document.querySelectorAll('#leadTbl th.sortable').forEach(function(th){
    var key = th.getAttribute('onclick').match(/setSort\('(\w+)'\)/)[1];
    var base = th.textContent.replace(/[▲▼]\s*$/, '').trim();
    th.innerHTML = esc(base) + (SORT.key === key ? '<span class="dir">'+(SORT.dir === 'desc' ? '▼' : '▲')+'</span>' : '');
    th.title = t('sort_hint');
  });
  var rows = [], total = all.length, shown = 0;
  LEAD_ORDER.forEach(function(k){
    var it = byEmail[k]; if (!it) return; var l = it.l, n = it.n;
    if (!passes(l)) return;
    shown++;
    var canStop = ['stopped','unsubscribed','replied','completed'].indexOf(l.status) === -1;
    var etatChip = l.etat ? '<span class="badge b-'+esc(l.etat)+'">'+esc(t('etat_'+l.etat))+'</span>' : '';
    var flags = (l.slug_partage ? ' <span class="muted" title="'+esc(t('slug_partage', {n: 2}))+'">⧉</span>' : '')
              + (l.hors_portail ? ' <span class="muted" title="'+esc(t('hors_portail_row'))+'">⚠</span>' : '');
    rows.push('<tr><td class="muted">'+it.rang+'</td>'
      +'<td>'+esc(l.salon_name||'-')+flags+'<span class="sub">'+esc(l.email)+'</span></td>'
      +'<td>'+esc(String(l.mailbox||'').split('@')[0])+'</td>'
      +'<td>'+dots(Number(l.current_step)||0)+'</td>'
      +'<td title="'+esc(l.first_sent_at||'')+'">'+esc(l.first_sent_at ? rel(l.first_sent_at) : t('rel_never'))
        +(l.next_send_at ? '<span class="sub">'+esc(t('next_send'))+' '+esc(l.next_send_at)+'</span>' : '')+'</td>'
      +'<td>'+actCell(l)+'</td>'
      +'<td><span class="badge b-'+esc(l.status)+'">'+esc(l.status)+'</span> '+etatChip
        +(l.last_error?' <span class="muted" title="'+esc(l.last_error)+'">!</span>':'')+'</td>'
      +'<td>'+(canStop?'<button class="btn danger small" onclick="stopLead('+n.node_id+',\''+esc(l.lead_id)+'\')">Stop</button>':'')+'</td></tr>');
  });
  document.querySelector('#leadTbl tbody').innerHTML = rows.join('');
  document.getElementById('leadCount').textContent = t('lead_count', { shown: shown, total: total });
  document.getElementById('leadEmpty').style.display = total ? 'none' : 'block';
}

// --- import ---
function renderImportTargets(){
  var sel = document.getElementById('importTarget');
  var opts = ['<option value="roundrobin">'+t('import_rr')+'</option>'];
  (DATA.nodes_registered || []).forEach(function(n){
    if (n.enabled) opts.push('<option value="'+n.id+'">'+t('import_only', { mb: esc(n.mailbox) })+'</option>');
  });
  var cur = sel.value; sel.innerHTML = opts.join(''); if (cur) sel.value = cur;
}
function doImport(){
  if (BUSY) return;
  var f = document.getElementById('csvFile').files[0], pasted = document.getElementById('csvText').value.trim();
  if (f) { var rd = new FileReader(); rd.onload = function(){ sendCsv(rd.result); }; rd.readAsText(f); }
  else if (pasted) { sendCsv(pasted); }
  else { toast(t('import_choose'), true); }
}
function sendCsv(text){
  setBusy(true);
  var target = document.getElementById('importTarget').value;
  var body = target === 'roundrobin' ? { csv: text, mode: 'roundrobin' } : { csv: text, nodeId: Number(target) };
  api('/import', { body: body }).then(function(r){
    var out = document.getElementById('importResult');
    if (r.error) { out.textContent = r.error; toast(t('import_refused'), true); setBusy(false); return; }
    if (r.results) {
      out.textContent = r.results.map(function(x){
        return x.mailbox + ' : ' + (x.ok ? (t('imported_n', { n: (x.imported||0) + '/' + (x.rows_sent!=null?x.rows_sent:(x.imported||0)) })) : (t('refused') + x.error));
      }).join('\n');
      var allOk = r.results.every(function(x){ return x.ok; });
      toast(allOk ? t('import_done') : t('import_partial'), !allOk);
    } else {
      out.textContent = r.ok ? t('imported_n', { n: r.imported }) : r.error;
      toast(r.ok ? t('imported_n', { n: r.imported }) : r.error, !r.ok);
    }
    // Les lignes écartées ne sont pas des erreurs : on les montre pour que personne
    // ne cherche pourquoi le total importé est inférieur au fichier fourni.
    if (r.filtres && (r.filtres.desinscrits || r.filtres.deja_confies)) {
      out.textContent += '\n' + t('filtered_out', { u: r.filtres.desinscrits, d: r.filtres.deja_confies });
    }
    if (!r.error) { document.getElementById('csvText').value=''; document.getElementById('csvFile').value=''; }
    load();
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}

// --- séquence (steps) ---
function renderSteps(){
  // Saisie non enregistrée : on ne touche pas au DOM, sinon le contenu tapé est perdu.
  if (DIRTY_STEPS) return;
  var ok = okNodes();
  var src = ok[0];
  var srcEl = document.getElementById('stepsSource');
  var warnEl = document.getElementById('stepsDiffWarn');
  if (!src) { document.getElementById('steps').innerHTML = '<p class="muted">'+t('no_node_up')+'</p>'; srcEl.textContent=''; warnEl.classList.add('hide'); return; }
  srcEl.textContent = t('steps_source', { mb: src.mailbox });
  var ref = JSON.stringify(src.steps);
  var diff = ok.filter(function(n){ return JSON.stringify(n.steps) !== ref; }).map(function(n){ return n.mailbox; });
  if (diff.length) {
    warnEl.innerHTML = t('steps_diff', { list: esc(diff.join(', ')), ref: esc(src.mailbox) });
    warnEl.classList.remove('hide');
  } else warnEl.classList.add('hide');

  document.getElementById('steps').innerHTML = (src.steps || []).map(function(st, i){
    return '<div class="step-card"><b>Step '+st.step_no+'</b>'
      +'<label>'+t('lbl_subject')+'</label><input data-step="'+i+'" data-f="subject" value="'+esc(st.subject)+'">'
      +'<label>'+t('lbl_body')+'</label><textarea data-step="'+i+'" data-f="body">'+esc(st.body)+'</textarea>'
      +'<div class="grid2"><div><label>'+t('lbl_gap')+'</label><input type="number" min="0" data-step="'+i+'" data-f="gap_days" value="'+st.gap_days+'"></div>'
      +'<div><label>'+t('lbl_thread')+'</label><select data-step="'+i+'" data-f="thread_mode">'
        +'<option value="new"'+(st.thread_mode==='new'?' selected':'')+'>'+t('opt_new')+'</option>'
        +'<option value="reply"'+(st.thread_mode!=='new'?' selected':'')+'>'+t('opt_reply')+'</option>'
      +'</select></div></div></div>';
  }).join('');
}
function saveSteps(){
  if (BUSY) return; setBusy(true);
  var steps = [];
  for (var i = 0; i < 5; i++) {
    function g(f){ var el = document.querySelector('[data-step="'+i+'"][data-f="'+f+'"]'); return el ? el.value : ''; }
    steps.push({ subject:g('subject'), body:g('body'), gap_days:g('gap_days'), thread_mode:g('thread_mode') });
  }
  api('/steps', { body: { steps: steps } }).then(function(r){
    if (r.error) { toast(r.error, true); setBusy(false); return; }
    var bad = (r.results||[]).filter(function(x){ return !x.ok; });
    toast(bad.length ? (t('fail_on') + bad.map(function(x){ return x.mailbox; }).join(', ')) : t('steps_saved'), !!bad.length);
    // L'enregistrement est fini : on rend la main TOUT DE SUITE. Le rafraîchissement
    // part en fond, sinon le bouton reste grisé le temps que /overview réponde
    // (jusqu'à ~2 min quand un nœud Apps Script ne répond pas).
    DIRTY_STEPS = false; showUnsaved(); setBusy(false);
    load(true);
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}

// --- boîtes ---
function renderMailboxes(){
  if (DIRTY_MB) return; // idem : saisie en cours dans les réglages de boîtes
  var html = [];
  okNodes().forEach(function(n){
    (n.mailboxes || []).forEach(function(m, i){
      var key = n.node_id + '_' + i;
      html.push('<div class="card"><h3 style="margin-top:0">'+esc(m.address)+' <span class="muted">'+esc(m.display_name)+'</span></h3>'
        +'<div class="grid2">'
        +'<div><label>'+t('lbl_name')+'</label><input data-mb="'+key+'" data-f="display_name" value="'+esc(m.display_name)+'"></div>'
        +'<div><label>'+t('lbl_cap')+'</label><input type="number" min="0" data-mb="'+key+'" data-f="daily_cap" value="'+m.daily_cap+'"></div>'
        +'<div><label>'+t('lbl_days')+'</label><input data-mb="'+key+'" data-f="send_days" value="'+esc(m.send_days)+'"></div>'
        +'<div><label>'+t('lbl_wstart')+'</label><input data-mb="'+key+'" data-f="window_start" value="'+esc(m.window_start)+'"></div>'
        +'<div><label>'+t('lbl_wend')+'</label><input data-mb="'+key+'" data-f="window_end" value="'+esc(m.window_end)+'"></div>'
        +'<div><label>'+t('lbl_paused')+'</label><select data-mb="'+key+'" data-f="paused"><option value="false"'+(!m.paused?' selected':'')+'>'+t('no')+'</option><option value="true"'+(m.paused?' selected':'')+'>'+t('yes')+'</option></select></div>'
        +'<div style="display:flex;align-items:flex-end"><button class="btn primary" onclick="saveMailbox('+n.node_id+',\''+key+'\',\''+esc(m.address)+'\')">'+t('save')+'</button></div>'
        +'</div></div>');
    });
  });
  document.getElementById('mbEditors').innerHTML = html.length ? html.join('') : '<div class="card muted">'+t('no_node_up')+'</div>';
}
function saveMailbox(nodeId, key, address){
  if (BUSY) return; setBusy(true);
  function g(f){ return document.querySelector('[data-mb="'+key+'"][data-f="'+f+'"]').value; }
  var mb = { address: address, display_name: g('display_name'), daily_cap: g('daily_cap'), send_days: g('send_days'),
             window_start: g('window_start'), window_end: g('window_end'), paused: g('paused')==='true' };
  api('/mailbox', { body: { nodeId: nodeId, mailbox: mb } }).then(function(r){
    toast(r.ok ? t('mb_saved') : (r.error || t('failed')), !r.ok);
    setBusy(false);
    if (r.ok) { DIRTY_MB = false; load(true); }
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}

// --- nœuds ---
function renderNodes(){
  var rows = (DATA.nodes_registered || []).map(function(n){
    var h = n.last_health;
    var hTxt = h ? (h.ok ? ('ok · ' + esc(h.now_paris||'')) : ('ERR — ' + esc(h.error||''))) : '—';
    return '<tr><td>'+esc(n.mailbox)+'</td><td>'+esc(n.label||'')+'</td>'
      +'<td class="muted" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(n.exec_url)+'">'+esc(n.exec_url)+'</td>'
      +'<td>'+esc(n.token_hint)+'</td>'
      +'<td>'+(n.enabled?'<span class="badge b-ok">'+t('badge_on')+'</span>':'<span class="badge b-pending">'+t('badge_off')+'</span>')+'</td>'
      +'<td class="muted">'+hTxt+(n.last_health_at?(' <span class="muted">('+esc(n.last_health_at)+' UTC)</span>'):'')+'</td>'
      +'<td class="row" style="flex-wrap:nowrap">'
        +'<button class="btn small" onclick="healthNode('+n.id+')">'+t('node_health')+'</button>'
        +'<button class="btn small" onclick=\'editNode('+JSON.stringify(n).replace(/'/g,"&#39;")+')\'>'+t('node_edit')+'</button>'
        +'<button class="btn danger small" onclick="deleteNode('+n.id+',\''+esc(n.mailbox)+'\')">'+t('node_del')+'</button>'
      +'</td></tr>';
  });
  document.querySelector('#nodeTbl tbody').innerHTML = rows.length ? rows.join('')
    : '<tr><td colspan="7" class="muted">'+t('node_none')+'</td></tr>';
}
function editNode(n){
  document.getElementById('nodeFormTitle').textContent = t('node_edit_title', { mb: n.mailbox });
  document.getElementById('nf-id').value = n.id;
  document.getElementById('nf-mailbox').value = n.mailbox;
  document.getElementById('nf-label').value = n.label || '';
  document.getElementById('nf-url').value = n.exec_url;
  document.getElementById('nf-token').value = '';
  document.getElementById('nf-enabled').checked = !!n.enabled;
}
function resetNodeForm(){
  document.getElementById('nodeFormTitle').textContent = t('node_add_title');
  ['nf-id','nf-mailbox','nf-label','nf-url','nf-token'].forEach(function(id){ document.getElementById(id).value=''; });
  document.getElementById('nf-enabled').checked = true;
}
function saveNode(){
  if (BUSY) return; setBusy(true);
  var body = {
    id: document.getElementById('nf-id').value ? Number(document.getElementById('nf-id').value) : undefined,
    mailbox: document.getElementById('nf-mailbox').value.trim(),
    label: document.getElementById('nf-label').value.trim(),
    exec_url: document.getElementById('nf-url').value.trim(),
    api_token: document.getElementById('nf-token').value.trim() || undefined,
    enabled: document.getElementById('nf-enabled').checked
  };
  api('/nodes', { body: body }).then(function(r){
    toast(r.ok ? t('node_saved') : (r.error || t('failed')), !r.ok);
    if (r.ok) { resetNodeForm(); load(); } else setBusy(false);
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}
function healthNode(id){
  if (BUSY) return; setBusy(true);
  api('/nodes/'+id+'/health', { method:'POST', body:{} }).then(function(r){
    toast(r.ok ? t('health_ok', { mb: r.mailbox||'', st: r.campaign_status||'?' }) : (t('health_ko') + (r.error||'')), !r.ok);
    load();
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}
function deleteNode(id, mailbox){
  if (BUSY) return;
  if (!confirm(t('node_del_confirm', { mb: mailbox }))) return;
  setBusy(true);
  api('/nodes/'+id, { method:'DELETE' }).then(function(){ toast(t('node_deleted')); load(); })
    .catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}

// --- actions campagne / lead ---
function setCampaign(status){
  if (BUSY) return; setBusy(true);
  api('/campaign', { body: { status: status } }).then(function(r){
    if (r.error) { toast(r.error, true); setBusy(false); return; }
    var bad = (r.results||[]).filter(function(x){ return !x.ok; });
    toast(bad.length ? (t('fail_on') + bad.map(function(x){ return x.mailbox; }).join(', ')) : t('campaign_set', { st: status }), !!bad.length);
    load();
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}
function setCampaignNode(nodeId, status){
  if (BUSY) return; setBusy(true);
  api('/campaign', { body: { status: status, nodeId: nodeId } }).then(function(r){
    if (r.error) { toast(r.error, true); setBusy(false); return; }
    toast(t('node_set', { st: status })); load();
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}
function stopLead(nodeId, leadId){
  if (BUSY) return;
  if (!confirm(t('stop_confirm'))) return;
  setBusy(true);
  api('/lead-stop', { body: { nodeId: nodeId, leadId: leadId } }).then(function(r){
    toast(r.ok ? t('lead_stopped') : (r.error || t('failed')), !r.ok); if (r.ok) load(); else setBusy(false);
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}
// Lecture seule, indépendante de /overview (qui interroge les nœuds et peut prendre
// une minute) : la table centrale répond tout de suite. La réconciliation réutilise
// GET /suppression, qui elle interroge les nœuds — chargée à part, sans bloquer le tableau.
function loadUnsubscribes(){
  api('/unsubscribes').then(function(r){
    var rows = r.rows || [];
    var ps = r.par_source || {};
    document.getElementById('unsubCounts').textContent = t('unsub_counts', {
      total: r.total || 0, oc: ps['one-click'] || 0, sm: ps['suppression_manuelle'] || 0 });
    document.querySelector('#unsubTbl tbody').innerHTML = rows.map(function(u){
      var src = u.source === 'one-click' ? t('unsub_src_oneclick')
              : u.source === 'suppression_manuelle' ? t('unsub_src_manual') : esc(u.source || '?');
      var cls = u.source === 'one-click' ? 'b-unsubscribed' : 'b-stopped';
      var e = u.engagement;
      var act = e ? t('unsub_act_fmt', {
            o: e.ouvertures,
            p: e.prix_vu ? t('unsub_act_prix') : '',
            s: e.scrolls ? t('unsub_act_scroll') : '',
            e: e.editions ? t('unsub_act_edit') : '',
            d: e.appareil === 'mobile' ? t('unsub_dev_mobile') : t('unsub_dev_desktop'),
            last: e.dernier })
        : '<span class="muted">' + t('unsub_act_none') + '</span>';
      var et = u.etat || 'pas_de_trace';
      var vlabel = t('etat_' + et);
      var vcls = 'b-' + et;
      return '<tr><td>'+esc(u.email)+'</td><td><span class="badge '+cls+'">'+src+'</span></td><td>'+esc(u.date_paris||u.created_at)+'</td>'
        +'<td>'+act+'</td><td><span class="badge '+vcls+'">'+vlabel+'</span></td></tr>';
    }).join('');
    var pv = r.par_etat || {};
    document.getElementById('unsubVerdicts').textContent =
      t('unsub_etats', { h: pv.activite_humaine || 0, n: pv.ouverture_non_confirmee || 0, p: pv.pas_de_trace || 0 });
    document.getElementById('unsubEmpty').style.display = rows.length ? 'none' : 'block';
  }).catch(function(){ /* silencieux : la carte reste vide, /overview n'est pas affecté */ });
}
// Interroge les 4 nœuds : une fois au chargement, pas à chaque rafraîchissement.
function loadUnsubRecon(){
  api('/suppression').then(function(r){
    var n = r && typeof r.absentes_de_la_liste_centrale === 'number' ? r.absentes_de_la_liste_centrale : null;
    document.getElementById('unsubRecon').textContent =
      n === null ? '' : (n ? t('unsub_recon', { n: n }) : t('unsub_recon_none'));
  }).catch(function(){ document.getElementById('unsubRecon').textContent = ''; });
}

function pushSuppression(){
  if (BUSY) return;
  var emails = document.getElementById('suppText').value.split(/[\n,;]+/).map(function(s){ return s.trim(); }).filter(Boolean);
  if (!emails.length) { toast(t('supp_none'), true); return; }
  setBusy(true);
  api('/suppression', { body: { emails: emails } }).then(function(r){
    if (r.error) { toast(r.error, true); setBusy(false); return; }
    var msg = (r.results||[]).map(function(x){
      return x.mailbox + ' : ' + (x.ok ? ('+' + x.added + ' / ' + x.stopped + ' ' + t('stopped_n')) : ('ERR ' + x.error)); }).join('\n');
    toast(msg, (r.results||[]).some(function(x){ return !x.ok; }));
    document.getElementById('suppText').value = '';
    load();
  }).catch(function(e){ toast(t('err')+e.message, true); setBusy(false); });
}

applyStatic();
readHash();
load();
loadUnsubRecon();
setInterval(function(){
  if (BUSY || anyDirty() || document.hidden) return;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return; // curseur dans un champ
  load(true);
}, 180000);
</script>
